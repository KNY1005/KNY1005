  <text x="38" y="92" style="fill:rgb(101, 109, 118);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, sans-serif;font-size:13px;font-weight:400;text-anchor:start;dominant-baseline:auto">팀과 함께 문제를 해결하고, 더 나은 경험을 만드는 과정을 즐깁니다.</text>

